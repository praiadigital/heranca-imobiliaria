<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herança Imobiliária — Partilha do Imóvel de Praia | Praia Digital</title><meta name="description" content="Guia e calculadora de partilha do imóvel do litoral entre herdeiros: vender, dividir uso ou alugar e ratear."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#f5f0e8,#f7f3ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #8a6d3b22}h1{color:#6f5730;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input,select{width:100%;padding:.6rem;border:2px solid #e8dcc4;border-radius:10px;font-size:1rem}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#8a6d3b;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#f7f0e2;border-radius:12px;padding:1rem}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#8a6d3b;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/juridico-facil">Jurídico Fácil</a> · <a href="https://praia.digital/docs-imob">Docs Imob</a> · <a href="https://praia.digital/hora-de-vender">Hora de Vender</a></nav><div class="card"><h1>🏠 Herança Imobiliária</h1><p>O imóvel da família não precisa virar briga. Compare os 3 caminhos:</p><label>Valor estimado do imóvel (R$)</label><input id="v" type="number" value="600000"><label>Número de herdeiros</label><input id="h" type="number" value="3"><label>Renda líquida de temporada/ano (R$)</label><input id="r" type="number" value="20000"><label>Custo fixo anual (R$)</label><input id="c" type="number" value="12000"><button onclick="calc()">Comparar caminhos</button><div id="res"></div></div><script>function calc(){const g=id=>+document.getElementById(id).value;const v=g('v'),h=g('h'),r=g('r'),c=g('c');const porVenda=v/h,lq=r-c,porAlug=lq/h;document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<p>1️⃣ <b>Vender e dividir:</b> R$ ${porVenda.toLocaleString('pt-BR',{maximumFractionDigits:0})} por herdeiro (menos ITBI/ITCMD e corretagem — veja <a href="https://praia.digital/calculadora-custos">Calculadora de Custos</a>)</p><p>2️⃣ <b>Manter e alugar por temporada:</b> ${lq>0?'lucro de R$ '+porAlug.toFixed(0)+'/ano por herdeiro':'prejuízo de R$ '+Math.abs(porAlug).toFixed(0)+'/ano por herdeiro — repense'} + rodízio de uso familiar</p><p>3️⃣ <b>Um herdeiro fica e paga os outros:</b> quitação de R$ ${(v-porVenda).toLocaleString('pt-BR',{maximumFractionDigits:0})} (financiável)</p><p>⚠️ Não esqueça do ITCMD (4% em SP) e do inventário. Entenda os termos no <a href="https://praia.digital/juridico-facil">Jurídico Fácil</a>.</p>`}</script></body></html>
